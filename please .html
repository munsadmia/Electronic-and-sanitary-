            { id: "E41", name: "ফিউজ বেস", cat: "ডিস্ট্রিবিউশন ও প্রটেকশন", unit: "পিস" },
            { id: "E42", name: "ফিউজ ক্যারিয়ার", cat: "ডিস্ট্রিবিউশন ও প্রটেকশন", unit: "পিস" },
            { id: "E43", name: "LED বাল্ব", cat: "লাইট ও ফ্যান", unit: "পিস" },
            { id: "E44", name: "LED টিউবলাইট", cat: "লাইট ও ফ্যান", unit: "পিস" },
            { id: "E45", name: "প্যানেল লাইট", cat: "লাইট ও ফ্যান", unit: "পিস" },
            { id: "E46", name: "ডাউন লাইট", cat: "লাইট ও ফ্যান", unit: "পিস" },
            { id: "E47", name: "বাল্ব হোল্ডার", cat: "লাইট ও ফ্যান", unit: "পিস" },
            { id: "E48", name: "সিলিং রোজ", cat: "লাইট ও ফ্যান", unit: "পিস" },
            { id: "E49", name: "সিলিং ফ্যান", cat: "লাইট ও ফ্যান", unit: "পিস" },
            { id: "E50", name: "এক্সহস্ট ফ্যান", cat: "লাইট ও ফ্যান", unit: "পিস" },
            { id: "E51", name: "ফ্যান হুক", cat: "লাইট ও ফ্যান", unit: "পিস" },
            { id: "E52", name: "ফ্যান বক্স", cat: "লাইট ও ফ্যান", unit: "পিস" },
            { id: "E53", name: "আর্থ রড", cat: "আর্থিং", unit: "পিস" },
            { id: "E54", name: "GI পাইপ", cat: "আর্থিং", unit: "পিস" },
            { id: "E55", name: "আর্থ ক্ল্যাম্প", cat: "আর্থিং", unit: "পিস" },
            { id: "E56", name: "চারকোল", cat: "আর্থিং", unit: "কেজি" },
            { id: "E57", name: "লবণ", cat: "আর্থিং", unit: "কেজি" },
            { id: "E58", name: "ইনসুলেশন টেপ", cat: "সরঞ্জাম", unit: "পিস" },
            { id: "E59", name: "কেবল টাই", cat: "সরঞ্জাম", unit: "প্যাকেট" },
            { id: "E60", name: "ওয়াল প্লাগ", cat: "সরঞ্জাম", unit: "প্যাকেট" },
            { id: "E61", name: "স্ক্রু", cat: "সরঞ্জাম", unit: "প্যাকেট" },
            { id: "E62", name: "তার ক্লিপ", cat: "সরঞ্জাম", unit: "প্যাকেট" },
            { id: "E63", name: "টার্মিনাল ব্লক", cat: "সরঞ্জাম", unit: "পিস" },
            { id: "E64", name: "কেবল লগ", cat: "সরঞ্জাম", unit: "পিস" },
            { id: "E65", name: "ফেকূল", cat: "সরঞ্জাম", unit: "পিস" },
            { id: "E66", name: "কলিং বেল", cat: "সরঞ্জাম", unit: "পিস" },
            { id: "E67", name: "টিভি সকেট", cat: "নেটওয়ার্ক ও কমিউনিকেশন", unit: "পিস" },
            { id: "E68", name: "LAN সকেট", cat: "নেটওয়ার্ক ও কমিউনিকেশন", unit: "পিস" },
            { id: "E69", name: "CCTV পয়েন্ট", cat: "নেটওয়ার্ক ও কমিউনিকেশন", unit: "পয়েন্ট" },
            { id: "E70", name: "Wi-Fi পয়েন্ট", cat: "নেটওয়ার্ক ও কমিউনিকেশন", unit: "পয়েন্ট" }
        ];

        // ==================== State ====================
        let currentMainTab = 'sanitary';
        let currentCategory = 'all';
        let quantities = {};
        let currentProducts = sanitaryProducts;
        let customProducts = []; // কাস্টম মালামাল এখানে জমা হবে

        // ==================== Tab Switching ====================
        function switchMainTab(tab) {
            currentMainTab = tab;
            currentCategory = 'all';

            const tabSanitary = document.getElementById('tabSanitary');
            const tabElectronic = document.getElementById('tabElectronic');
            const categorySanitary = document.getElementById('categoryFilterSanitary');
            const categoryElectronic = document.getElementById('categoryFilterElectronic');
            const printTitle = document.getElementById('printTitle');
            const printSubtitle = document.getElementById('printSubtitle');

            [tabSanitary, tabElectronic].forEach(t => {
                t.classList.remove('tab-active');
                t.classList.add('bg-gray-100', 'text-gray-700', 'hover:bg-gray-200');
            });

            categorySanitary.style.display = 'none';
            categoryElectronic.style.display = 'none';

            if (tab === 'sanitary') {
                tabSanitary.classList.add('tab-active');
                tabSanitary.classList.remove('bg-gray-100', 'text-gray-700', 'hover:bg-gray-200');
                categorySanitary.style.display = 'flex';
                currentProducts = sanitaryProducts;
                printTitle.innerText = 'স্যানিটারি মালামালের কাজের তালিকা';
                printSubtitle.innerText = 'প্রস্তুতকারী: স্যানিটারি ইঞ্জিনিয়ার';
            } else if (tab === 'electronic') {
                tabElectronic.classList.add('tab-active');
                tabElectronic.classList.remove('bg-gray-100', 'text-gray-700', 'hover:bg-gray-200');
                categoryElectronic.style.display = 'flex';
                currentProducts = electronicProducts;
                printTitle.innerText = 'ইলেকট্রনিক মালামালের কাজের তালিকা';
                printSubtitle.innerText = 'প্রস্তুতকারী: ইলেকট্রিশিয়ান';
            }

            document.getElementById('searchInput').value = '';

            // ক্যাটাগরি বাটন রিসেট
            document.querySelectorAll('.cat-btn, .cat-btn-e').forEach(btn => {
                btn.classList.remove('active', 'bg-blue-600', 'text-white');
                btn.classList.add('bg-gray-100', 'text-gray-700');
            });
            const firstBtn = tab === 'sanitary' 
                ? document.querySelector('#categoryFilterSanitary .cat-btn')
                : document.querySelector('#categoryFilterElectronic .cat-btn-e');
            if (firstBtn) {
                firstBtn.classList.add('active', 'bg-blue-600', 'text-white');
                firstBtn.classList.remove('bg-gray-100', 'text-gray-700');
            }

            renderProducts();
            updateSummary();
        }

        // ==================== Render Products ====================
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            // মূল প্রোডাক্ট এবং কাস্টম প্রোডাক্ট একসাথে দেখাবে
            const allDisplayProducts = [...currentProducts, ...customProducts];

            const filtered = allDisplayProducts.filter(p => {
                const matchesCat = (currentCategory === 'all' || p.cat === currentCategory);
                const matchesSearch = p.name.toLowerCase().includes(searchTerm) || p.id.toLowerCase().includes(searchTerm);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-500 bg-white rounded-xl">
                        <i class="fa-solid fa-circle-exclamation text-3xl mb-2 text-yellow-500"></i>
                        <p>কোনো মালামাল খুঁজে পাওয়া যায়নি!</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(product => {
                const key = currentMainTab + '_' + product.id;
                const qty = quantities[key] ? quantities[key].qty : '';
                const unit = product.unit || 'টি/ফুট';
                const isCustom = product.cat === 'নিজের যোগ করা';
                
                const card = document.createElement('div');
                // কাস্টম হলে একটু আলাদা রঙ
                card.className = `bg-white p-4 rounded-xl border ${isCustom ? 'border-yellow-300 bg-yellow-50' : 'border-gray-100'} shadow-sm hover:shadow-md transition flex items-center justify-between gap-3`;
                card.innerHTML = `
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="w-10 h-10 rounded-lg ${isCustom ? 'bg-yellow-200 text-yellow-700' : 'bg-blue-50 text-blue-600'} flex items-center justify-center font-bold text-xs shrink-0">
                            ${product.id}
                        </div>
                        <div class="min-w-0">
                            <h3 class="font-semibold text-gray-800 text-sm leading-tight">${product.name}</h3>
                            <span class="text-xs ${isCustom ? 'bg-yellow-200 text-yellow-800' : 'bg-gray-100 text-gray-400'} px-2 py-0.5 rounded-full inline-block mt-1">${product.cat}</span>
                        </div>
                    </div>
                    <div class="w-24 shrink-0">
                        <input type="number" min="0" value="${qty}" placeholder="পরিমাণ" 
                               oninput="updateQuantity('${product.id}', this.value, '${unit}')"
                               class="w-full px-2 py-1.5 border border-gray-300 rounded-lg text-center focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ==================== Update Quantity ====================
        function updateQuantity(id, val, unit) {
            const key = currentMainTab + '_' + id;
            const num = parseInt(val);
            if (num > 0) {
                quantities[key] = { id: id, qty: num, unit: unit || 'টি/ফুট', tab: currentMainTab };
            } else {
                delete quantities[key];
            }
            updateSummary();
        }

        // ==================== Update Summary ====================
        function updateSummary() {
            const summaryList = document.getElementById('summaryList');
            const printTableBody = document.getElementById('printTableBody');
            const totalItemsCount = document.getElementById('totalItemsCount');
            
            summaryList.innerHTML = '';
            printTableBody.innerHTML = '';

            const keys = Object.keys(quantities).filter(k => k.startsWith(currentMainTab + '_'));
            totalItemsCount.innerText = `${keys.length} টি আইটেম`;

            if (keys.length === 0) {
                summaryList.innerHTML = `
                    <div class="text-center py-8 text-gray-400">
                        <i class="fa-solid fa-box-open text-4xl mb-2"></i>
                        <p>এখনো কোনো মালামাল যুক্ত করা হয়নি।</p>
                        <p class="text-xs">তালিকা থেকে পরিমাণ লিখুন।</p>
                    </div>
                `;
                return;
            }

            const allDisplayProducts = [...currentProducts, ...customProducts];

            keys.forEach((key, index) => {
                const item = quantities[key];
                const product = allDisplayProducts.find(p => p.id === item.id);
                if (!product) return;

                const isCustom = product.cat === 'নিজের যোগ করা';
                const badgeColor = isCustom ? 'bg-yellow-100 text-yellow-800' : 'bg-blue-100 text-blue-800';

                const itemEl = document.createElement('div');
                itemEl.className = 'flex justify-between items-center bg-gray-50 p-2.5 rounded-lg border border-gray-100 text-sm';
                itemEl.innerHTML = `
                    <div class="truncate pr-2 min-w-0">
                        <div class="font-medium text-gray-700 truncate">${product.name}</div>
                        <span class="text-[10px] ${badgeColor} px-1.5 py-0.5 rounded">${product.cat}</span>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <span class="bg-blue-100 text-blue-800 font-bold px-2.5 py-1 rounded text-xs">${item.qty} ${item.unit}</span>
                        <button onclick="removeItem('${key}')" class="text-gray-400 hover:text-red-500 p-1">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                `;
                summaryList.appendChild(itemEl);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="border border-gray-300 px-4 py-2 text-center">${index + 1}</td>
                    <td class="border border-gray-300 px-4 py-2">${product.name} <span class="text-xs text-gray-500">(${product.cat})</span></td>
                    <td class="border border-gray-300 px-4 py-2 text-center font-bold">${item.qty} ${item.unit}</td>
                `;
                printTableBody.appendChild(tr);
            });
        }

        function removeItem(key) {
            delete quantities[key];
            renderProducts();
            updateSummary();
        }

        function clearAll() {
            const msg = currentMainTab === 'sanitary' ? 'স্যানিটারি মালামালের সমস্ত হিসাব মুছে ফেলতে চান?' : 'ইলেকট্রনিক মালামালের সমস্ত হিসাব মুছে ফেলতে চান?';
            if (!confirm(msg)) return;

            Object.keys(quantities).forEach(key => {
                if (key.startsWith(currentMainTab + '_')) {
                    delete quantities[key];
                }
            });
            renderProducts();
            updateSummary();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            const isElectronic = currentMainTab === 'electronic';
            const selector = isElectronic ? '.cat-btn-e' : '.cat-btn';
            
            document.querySelectorAll(selector).forEach(btn => {
                btn.classList.remove('active', 'bg-blue-600', 'text-white');
                btn.classList.add('bg-gray-100', 'text-gray-700');
            });
            event.target.classList.add('active', 'bg-blue-600', 'text-white');
            event.target.classList.remove('bg-gray-100', 'text-gray-700');
            renderProducts();
        }

        function filterProducts() { renderProducts(); }

        // ==================== নিজের ইচ্ছামতো মালামাল যোগ ====================
        function addCustomProduct() {
            const nameInput = document.getElementById('customName');
            const unitInput = document.getElementById('customUnit');
            const qtyInput = document.getElementById('customQty');
            
            const name = nameInput.value.trim();
            const unit = unitInput.value;
            const qty = parseInt(qtyInput.value) || 1;
            
            if (!name) {
                alert('❌ মালামালের নাম লিখুন!');
                nameInput.focus();
                return;
            }

            const customId = 'C' + (customProducts.length + 1);
            const newProduct = {
                id: customId,
                name: name,
                cat: 'নিজের যোগ করা',
                unit: unit
            };
            
            customProducts.push(newProduct);
            
            // সরাসরি হিসাব তালিকায় যোগ করে দাও
            const key = currentMainTab + '_' + customId;
            quantities[key] = { id: customId, qty: qty, unit: unit, tab: currentMainTab };
            
            // রেন্ডার আপডেট
            renderProducts();
            updateSummary();
            
            // ইনপুট ক্লিয়ার
            nameInput.value = '';
            qtyInput.value = '1';
            nameInput.focus();

            // সাকসেস নোটিফিকেশন
            const toast = document.createElement('div');
            toast.className = 'fixed top-24 right-5 bg-green-500 text-white px-4 py-3 rounded-lg shadow-lg z-50 flex items-center gap-2 text-sm';
            toast.innerHTML = '<i class="fa-solid fa-check-circle"></i> সফলভাবে যোগ হয়েছে!';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // Enter কি চাপলে যোগ হবে
        document.addEventListener('DOMContentLoaded', function() {
            const nameInput = document.getElementById('customName');
            if (nameInput) {
                nameInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') addCustomProduct();
                });
            }
        });

        // ==================== Init ====================
        window.onload = () => {
            renderProducts();
            document.getElementById('printDate').innerText = new Date().toLocaleDateString('bn-BD');
        };
    </script>
</body>
